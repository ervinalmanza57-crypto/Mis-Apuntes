<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#c2185b"><link rel="apple-touch-icon" href="icon-192.png"><title>Gestión Belcorp</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8fc;--card:#fff;--ink:#2a1a3a;--mute:#7a6a8a;--line:#e8dff0;--acc:#c2185b;--acc2:#0e8f8a;--onacc:#fff;--warn:#b26a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171020;--card:#241a31;--ink:#f3ecf8;--mute:#a595b5;--line:#3a2c4b;--acc:#f06292;--acc2:#4fd1c5;--onacc:#1a0f24;--warn:#ffb74d}}
:root[data-theme="dark"]{--bg:#171020;--card:#241a31;--ink:#f3ecf8;--mute:#a595b5;--line:#3a2c4b;--acc:#f06292;--acc2:#4fd1c5;--onacc:#1a0f24;--warn:#ffb74d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Nunito,system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:Sora,system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:14px 16px;min-height:60px}
.top h2{font-size:1.15rem;flex:1}
.ib{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:1.25rem;display:grid;place-items:center;position:relative}
.ib:focus-visible,.btn:focus-visible,.big:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--acc)}
.home{flex:1;display:flex;flex-direction:column}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.logo{width:132px;height:132px;border-radius:38px;background:linear-gradient(140deg,var(--acc),#7b2cbf);display:grid;place-items:center;font-family:Sora;font-size:3.2rem;color:#fff;overflow:hidden;margin-bottom:22px}
.logo img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:1.9rem;line-height:1.15}
.hero p{color:var(--mute);margin:8px 0 0;max-width:30ch}
.dock{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.big{min-height:84px;border-radius:20px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700}
.big span{font-size:1.6rem}
.big:active,.row:active{transform:scale(.98)}
.pad{padding:0 16px 24px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.row .e{font-size:1.5rem;width:40px;text-align:center}
.row b{display:block}.row small{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h3{font-size:1rem;margin-bottom:12px}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
input[type=text],input[type=tel],input[type=number],input[type=password],select,textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit}
.btn{min-height:48px;padding:0 20px;border-radius:14px;border:0;background:var(--acc);color:var(--onacc);font-weight:700}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}
.empty{text-align:center;color:var(--mute);padding:32px 16px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.tog{display:flex;align-items:center;justify-content:space-between;min-height:46px;gap:10px}
.tog input{width:24px;height:24px;accent-color:var(--acc)}
.pend{color:var(--warn);font-size:.9rem;margin:6px 0 0;padding-left:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;z-index:9}
#lock{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.prev{display:flex;gap:14px;align-items:center}.prev .logo{width:64px;height:64px;border-radius:18px;font-size:1.6rem;margin:0}
.wrap{overflow-x:auto}
.thumb{width:48px;height:48px;border-radius:14px;background:var(--line);display:grid;place-items:center;font-family:Sora;font-weight:700;overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center;font-size:.85rem;color:var(--mute)}.stats b{display:block;font-size:1.4rem;color:var(--ink);font-family:Sora}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:5}
.prev input[type=file]{flex:1;min-width:0}
</style>
</head>
<body>
<div id="lock"><h2>Ingresa tu PIN</h2><input id="pin" type="password" inputmode="numeric" maxlength="8" style="max-width:220px;text-align:center"><button class="btn" id="unlock">Entrar</button><small id="lockerr" style="color:var(--acc)"></small></div>
<div class="app" id="app"></div>
<script>
/* ---------- Base de datos local (IndexedDB) ---------- */
const STORES={products:'id',lots:'id',customers:'id',campaigns:'id',campaignItems:'id',customerOrders:'id',orderItems:'id',receptions:'id',receptionItems:'id',sales:'id',saleItems:'id',payments:'id',advances:'id',expenses:'id',qrs:'id',invMovements:'id',adjustments:'id',returns:'id',history:'id',notifications:'id',settings:'key'};
const DB_NAME='gestion-belcorp',DB_VER=1,mem={};let db=null;
function openDB(){return new Promise(res=>{try{const r=indexedDB.open(DB_NAME,DB_VER);
r.onupgradeneeded=()=>{const d=r.result;for(const s in STORES)if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:STORES[s]})};
r.onsuccess=()=>{db=r.result;res(true)};r.onerror=()=>res(false)}catch(e){res(false)}})}
function tx(s,mode,fn){return new Promise((ok,ko)=>{if(!db){ok(fn(null,s));return}const t=db.transaction(s,mode);const out=fn(t.objectStore(s),s);t.oncomplete=()=>ok(out&&out.result!==undefined?out.result:out);t.onerror=()=>ko(t.error)})}
const DB={
 async all(s){if(!db)return Object.values(mem[s]||{});return new Promise((ok,ko)=>{const r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})},
 async put(s,o){if(!db){(mem[s]=mem[s]||{})[o[STORES[s]]]=o;return}return tx(s,'readwrite',st=>st.put(o))},
 async get(s,k){if(!db)return (mem[s]||{})[k];return new Promise(ok=>{const r=db.transaction(s).objectStore(s).get(k);r.onsuccess=()=>ok(r.result);r.onerror=()=>ok(undefined)})},
 async clear(s){if(!db){mem[s]={};return}return tx(s,'readwrite',st=>st.clear())}
};
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
async function log(type,text,ref){await DB.put('history',{id:uid('h'),at:new Date().toISOString(),type,text,ref:ref||null})}

/* ---------- Configuración y decisiones pendientes ---------- */
const DEFAULTS={key:'app',name:'Mi negocio Belcorp',slogan:'Belleza que llega a tu puerta',phone:'',address:'',logo:'',margin:30,pin:'',theme:'auto',counters:{},categories:['Perfumes','Maquillaje','Cuidado facial','Cuidado corporal','Cabello','Otros'],
 notif:{clientes:true,pedidos:true,inventario:true,recepciones:true,campanas:true},
 rules:{marginFormula:null,lotConsumption:null,promoCost:null,overpayment:null,advanceCancel:null,creditDue:null,returns:null,cashBalances:null,personalWithdrawals:null,corrections:null}};
const PENDING={marginFormula:'Fórmula del margen (sobre costo o sobre precio final)',lotConsumption:'Qué lote se consume primero al vender',promoCost:'Costo de factura con promociones Belcorp (requiere factura real)',overpayment:'Pago superior a la deuda',advanceCancel:'Anticipo cancelado',creditDue:'Vencimiento de créditos',returns:'Política de devoluciones',cashBalances:'Saldos de efectivo/QR',personalWithdrawals:'Retiros personales',corrections:'Reglas finales de corrección'};
let S={...DEFAULTS};
async function loadSettings(){const s=await DB.get('settings','app');S={...DEFAULTS,...(s||{}),notif:{...DEFAULTS.notif,...((s||{}).notif||{})},rules:{...DEFAULTS.rules,...((s||{}).rules||{})}}}
const saveSettings=()=>DB.put('settings',S);

/* ---------- Utilidades ---------- */
const $=(q,e=document)=>e.querySelector(q);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function applyTheme(){document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme;if(S.theme==='auto')delete document.documentElement.dataset.theme}
const logoHTML=()=>S.logo?`<img src="${S.logo}" alt="Logo">`:esc((S.name||'N').trim().charAt(0).toUpperCase());
const head=(title,back='#/')=>`<div class="top"><a class="ib" href="${back}" aria-label="Volver" style="text-decoration:none;color:inherit">←</a><h2>${title}</h2></div>`;
const soon=(n,txt)=>`<div class="empty"><b>${txt}</b>Se construye en la fase ${n}.</div>`;

/* ---------- Pantallas ---------- */
const V={};
V.home=async()=>{const n=(await calcNotifs()).filter(x=>x.st==='nueva').length;
return `<div class="top"><a class="ib" href="#/buscar" aria-label="Buscar" style="text-decoration:none">🔍</a><span style="flex:1"></span><a class="ib" href="#/notificaciones" aria-label="Notificaciones" style="text-decoration:none">🔔${n?'<i class="dot"></i>':''}</a><a class="ib" href="#/config" aria-label="Configuración" style="text-decoration:none">⚙️</a></div>
<div class="home"><div class="hero"><div class="logo">${logoHTML()}</div><h1>${esc(S.name)}</h1><p>${esc(S.slogan)}</p></div>
<div class="dock"><a class="big" href="#/registro" style="text-decoration:none;color:inherit"><span>📝</span>Registro</a><a class="big" href="#/inventario" style="text-decoration:none;color:inherit"><span>📦</span>Inventario</a><a class="big" href="#/clientes" style="text-decoration:none;color:inherit"><span>👤</span>Clientes</a><a class="big" href="#/qr" style="text-decoration:none;color:inherit"><span>📱</span>QR y pagos</a></div></div>`};
V.registro=()=>{const o=[['🛒','Venta','Vender a un cliente',6],['📦','Pedido','Pedido de un cliente',4],['💰','Cobro','Recibir dinero de una deuda',7],['📥','Recepción Belcorp','Registrar lo que llegó',5],['💸','Gasto','Gastos del negocio',8],['📋','Historial','Todas las operaciones',9]];
return head('Registro')+`<div class="pad">${o.map(x=>`<a class="row" href="#/pronto/${x[3]}/${encodeURIComponent(x[1])}" style="text-decoration:none;color:inherit"><span class="e">${x[0]}</span><span><b>${x[1]}</b><small>${x[2]}</small></span></a>`).join('')}<a class="row" href="#/campanas" style="text-decoration:none;color:inherit"><span class="e">🗓️</span><span><b>Campañas</b><small>TC, pedido y recepción por campaña</small></span></a></div>`};
V.pronto=(p)=>head(decodeURIComponent(p[1]||''),'#/registro')+soon(p[0],'Aún no disponible');
V.campanas=()=>head('Campañas','#/registro')+soon(4,'Sin campañas todavía');
V.notificaciones=()=>head('Notificaciones')+soon(10,'Nada requiere tu atención');
/* ===== FASE 2: productos, categorías e inventario ===== */
const BRANDS=['ÉSIKA',"L'BEL",'CYZONE'],REASONS=['Dañado','Perdido','Error de recepción','Error de inventario','Otro'];
const F={q:'',brand:'',cat:'',av:''};
const bs=n=>'Bs '+(Number(n)||0).toLocaleString('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const fdate=d=>new Date(d).toLocaleDateString('es-BO',{day:'2-digit',month:'short',year:'numeric'});
const MT={inicial:'Inventario inicial',ajuste:'Ajuste'};
async function stockMap(){const m={},g=p=>m[p]=m[p]||{ent:0,sal:0,res:0};for(const x of await DB.all('invMovements')){const s=g(x.productId);x.qty>0?s.ent+=x.qty:s.sal-=x.qty}
 const ok=new Set((await DB.all('customerOrders')).filter(o=>o.status!=='Cancelado').map(o=>o.id));for(const i of await DB.all('orderItems'))if(ok.has(i.orderId))g(i.productId).res+=i.reserved;return m}
const calc=s=>{s=s||{ent:0,sal:0,res:0};const fis=s.ent-s.sal,res=s.res||0;return{fis,res,disp:fis-res,ent:s.ent,sal:s.sal}};
const thumb=p=>`<div class="thumb">${p.photo?`<img src="${p.photo}" alt="">`:esc(p.name.charAt(0).toUpperCase())}</div>`;
const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function shrink(f,size,cb){const r=new FileReader();r.onerror=()=>toast('No se pudo leer la imagen');r.onload=()=>{const img=new Image;img.onerror=()=>toast('No se pudo abrir la imagen');img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d'),s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);cb(c.toDataURL('image/jpeg',.8))};img.src=r.result};r.readAsDataURL(f)}
const lnk='style="text-decoration:none;color:inherit"';

V.inventario=()=>head('Inventario')+`<div style="padding:0 16px 10px;display:flex;gap:8px"><input id="q" type="text" placeholder="Buscar por nombre o código" aria-label="Buscar producto" value="${esc(F.q)}"><a class="ib" href="#/categorias" aria-label="Categorías" style="text-decoration:none">🏷️</a></div>
<div class="chips" id="chb"></div><div class="chips" id="chd"></div><div class="pad" id="plist"></div>
<a class="btn fab" href="#/prodform/nuevo" style="text-decoration:none;display:grid;place-items:center">+ Producto</a>`;
V.inventario.after=()=>{
 const draw=async()=>{const ps=await DB.all('products'),sm=await stockMap(),q=F.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows=ps.filter(p=>{const c=calc(sm[p.id]),t=(p.name+' '+p.code+' '+p.brand).toLowerCase();
   return q.every(w=>t.includes(w))&&(!F.brand||p.brand===F.brand)&&(!F.cat||p.category===F.cat)&&(!F.av||(F.av==='ok'&&c.disp>0)||(F.av==='low'&&c.disp>0&&c.disp<=p.minStock)||(F.av==='out'&&c.disp<=0))}).sort((a,b)=>a.name.localeCompare(b.name));
  $('#plist').innerHTML=rows.length?rows.map(p=>{const c=calc(sm[p.id]),st=c.disp<=0?['Agotado','var(--acc)']:c.disp<=p.minStock?['Stock bajo','var(--warn)']:['disp.','var(--mute)'];
   return `<a class="row" href="#/prod/${p.id}" ${lnk}>${thumb(p)}<span style="flex:1"><b>${esc(p.name)}</b><small>${p.brand} · ${esc(p.category)}${p.code?' · '+esc(p.code):''}${p.active?'':' · Inactivo'}</small></span><span style="text-align:right"><b>${c.disp}</b><small style="display:block;color:${st[1]}">${st[0]}</small></span></a>`}).join(''):`<div class="empty"><b>${ps.length?'Sin resultados':'Aún no hay productos'}</b>${ps.length?'Prueba con otros filtros.':'Toca “+ Producto” para agregar el primero.'}</div>`};
 const chips=()=>{$('#chb').innerHTML=[['','Todas'],...BRANDS.map(b=>[b,b])].map(([v,l])=>`<button class="chip ${F.brand===v?'on':''}" data-b="${esc(v)}">${esc(l)}</button>`).join('');
  $('#chd').innerHTML=`<select id="fc" aria-label="Categoría" style="width:auto;flex:none"><option value="">Todas las categorías</option>${opts(S.categories,F.cat)}</select>`+[['','Todos'],['ok','Disponibles'],['low','Stock bajo'],['out','Agotados']].map(([v,l])=>`<button class="chip ${F.av===v?'on':''}" data-a="${v}">${l}</button>`).join('');
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{F.brand=b.dataset.b;chips();draw()});
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{F.av=b.dataset.a;chips();draw()});
  $('#fc').onchange=e=>{F.cat=e.target.value;draw()}};
 $('#q').oninput=e=>{F.q=e.target.value;draw()};chips();draw()};

V.prodform=async([id])=>{const n=id==='nuevo',p=n?{name:'',brand:BRANDS[0],code:'',category:S.categories[0]||'',photo:'',active:true,minStock:0}:await DB.get('products',id);
 if(!p)return head('Producto','#/inventario')+soon(2,'Producto no encontrado');
 return head(n?'Nuevo producto':'Editar producto',n?'#/inventario':'#/prod/'+id)+`<div class="pad"><div class="card"><div class="prev"><div id="pp">${thumb(p)}</div><input id="p-f" type="file" accept="image/*" aria-label="Foto"></div>
<label for="p-n">Nombre</label><input id="p-n" type="text" value="${esc(p.name)}">
<label for="p-b">Marca</label><select id="p-b">${opts(BRANDS,p.brand)}</select>
<label for="p-c">Código</label><input id="p-c" type="text" value="${esc(p.code)}">
<label for="p-g">Categoría</label><select id="p-g">${opts(S.categories,p.category)}</select>
<label for="p-m">Stock mínimo</label><input id="p-m" type="number" inputmode="numeric" min="0" step="1" value="${p.minStock}">
<label class="tog"><span>Producto activo</span><input id="p-a" type="checkbox" ${p.active?'checked':''}></label>
<div class="btns"><button class="btn" id="ok" style="flex:1">Guardar producto</button></div></div></div>`};
V.prodform.after=async([id])=>{const n=id==='nuevo',old=n?null:await DB.get('products',id);if(!n&&!old)return;let photo=old?old.photo:'';
 $('#p-f').onchange=e=>{const f=e.target.files[0];if(f)shrink(f,320,d=>{photo=d;$('#pp').innerHTML=thumb({name:$('#p-n').value||'?',photo})})};
 $('#ok').onclick=async()=>{const name=$('#p-n').value.trim(),code=$('#p-c').value.trim();if(!name){toast('Escribe el nombre del producto');return}
  const all=await DB.all('products');if(code&&all.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==(old&&old.id))){toast('Ya existe un producto con ese código');return}
  const p={...(old||{id:uid('p'),createdAt:new Date().toISOString()}),name,brand:$('#p-b').value,code,category:$('#p-g').value,photo,active:$('#p-a').checked,minStock:Math.max(0,parseInt($('#p-m').value)||0)};
  await DB.put('products',p);await log('producto',(n?'Producto creado: ':'Producto editado: ')+name,p.id);toast('Producto guardado');location.hash='#/prod/'+p.id}};

V.prod=async([id])=>{const p=await DB.get('products',id);if(!p)return head('Producto','#/inventario')+soon(2,'Producto no encontrado');
 const mv=(await DB.all('invMovements')).filter(m=>m.productId===id).sort((a,b)=>b.at.localeCompare(a.at)),lots=(await DB.all('lots')).filter(l=>l.productId===id).sort((a,b)=>b.date.localeCompare(a.date));
 let ent=0,sal=0;mv.forEach(m=>m.qty>0?ent+=m.qty:sal-=m.qty);const c=calc({ent,sal}),la=l=>mv.filter(m=>m.lotId===l.id).reduce((s,m)=>s+m.qty,0);
 return head(esc(p.name),'#/inventario')+`<div class="pad"><div class="card"><div class="prev">${thumb(p)}<div><b>${esc(p.name)}</b><br><small style="color:var(--mute)">${p.brand} · ${esc(p.category)}${p.code?' · '+esc(p.code):''}<br>${p.active?'Activo':'Inactivo'} · Stock mínimo ${p.minStock}</small></div></div></div>
<div class="card"><h3>Inventario</h3><div class="stats"><div><b>${c.fis}</b>Físico</div><div><b>${c.res}</b>Reservado</div><div><b>${c.disp}</b>Disponible</div><div><b>${c.ent}</b>Entradas</div><div><b>${c.sal}</b>Salidas</div></div></div>
<div class="card"><h3>Lotes</h3>${lots.length?lots.map(l=>`<div class="tog" style="align-items:flex-start"><span><b>${esc(l.label)}</b><small style="display:block;color:var(--mute)">${fdate(l.date)} · costo ${bs(l.cost)} · venta ${bs(l.salePrice)}</small></span><b>${la(l)}/${l.qtyReceived}</b></div>`).join(''):'<small style="color:var(--mute)">Sin lotes todavía.</small>'}
<p style="color:var(--mute);font-size:.85rem;margin:8px 0 0">Precio USD, TC y precio sugerido llegan con las recepciones (fase 5) y con la regla de margen pendiente.</p></div>

V.stock=async([id,t])=>{const p=await DB.get('products',id);if(!p)return head('Stock','#/inventario')+soon(2,'Producto no encontrado');
 const today=new Date().toISOString().slice(0,10),back='#/prod/'+id,num='inputmode="decimal" min="0" step="0.01"';
 if(t==='inicial')return head('Inventario inicial',back)+`<div class="pad"><div class="card"><b>${esc(p.name)}</b><small style="display:block;color:var(--mute)">Para lo que ya tenías antes de usar la app. Queda como lote aparte de las recepciones Belcorp.</small>

 const mv=(await DB.all('invMovements')).filter(m=>m.productId===id),lots=(await DB.all('lots')).filter(l=>l.productId===id);
 return head('Ajustar stock',back)+`<div class="pad"><div class="card"><b>${esc(p.name)}</b><small style="display:block;color:var(--mute)">Todo ajuste queda registrado con su motivo.</small>
${lots.length?`<label for="s-l">Lote</label><select id="s-l">${lots.map(l=>`<option value="${l.id}">${esc(l.label)} · disp. ${mv.filter(m=>m.lotId===l.id).reduce((s,m)=>s+m.qty,0)}</option>`).join('')}</select>
<label for="s-s">Tipo</label><select id="s-s"><option value="-1">Restar unidades</option><option value="1">Sumar unidades</option></select>
<label for="s-q">Cantidad</label><input id="s-q" type="number" inputmode="numeric" min="1" step="1">

<label for="s-n">Observación</label><input id="s-n" type="text"><div class="btns"><button class="btn" id="ok" style="flex:1">Registrar ajuste</button></div>`:'<p>Este producto no tiene lotes. Primero carga el stock inicial.</p>'}</div></div>`};
V.stock.after=async([id,t])=>{const ok=$('#ok');if(!ok)return;
 ok.onclick=async()=>{const q=parseInt($('#s-q').value),now=new Date().toISOString();if(!(q>0)){toast('La cantidad debe ser mayor a 0');return}
  if(t==='inicial'){const cost=parseFloat($('#s-c').value),sp=parseFloat($('#s-p').value),date=$('#s-d').value;if(!(cost>=0)||!(sp>=0)){toast('Indica costo y precio de venta');return}
   const lot={id:uid('l'),productId:id,origin:'inicial',label:$('#s-o').value.trim()||'Lote inicial / origen desconocido',date,campaignId:null,tc:null,cost,salePrice:sp,qtyReceived:q,note:$('#s-n').value.trim()};
   await DB.put('lots',lot);await DB.put('invMovements',{id:uid('m'),productId:id,lotId:lot.id,at:now,date,type:'inicial',qty:q,reason:'',note:lot.note,ref:lot.id});await log('inventario','Inventario inicial +'+q,id)}
  else{const lotId=$('#s-l').value,sg=parseInt($('#s-s').value),avail=(await DB.all('invMovements')).filter(m=>m.lotId===lotId).reduce((s,m)=>s+m.qty,0);
   if(sg<0&&q>avail){toast('El lote solo tiene '+avail+' disponibles');return}
   await DB.put('invMovements',{id:uid('m'),productId:id,lotId,at:now,date:now.slice(0,10),type:'ajuste',qty:sg*q,reason:$('#s-r').value,note:$('#s-n').value.trim(),ref:null});await log('inventario','Ajuste '+(sg*q)+': '+$('#s-r').value,id)}
  toast('Guardado');location.hash='#/prod/'+id}};

V.config.after=()=>{
 $('#f-theme').value=S.theme;let logo=S.logo;
 const pv=()=>{$('#pn').textContent=$('#f-name').value;$('#ps').textContent=$('#f-slogan').value;$('#pl').innerHTML=logo?`<img src="${logo}" alt="Logo">`:esc(($('#f-name').value||'N').trim().charAt(0).toUpperCase())};

 const np=$('#nopin');if(np)np.onclick=async()=>{S.pin='';await saveSettings();toast('PIN quitado');render()};
 $('#exp').onclick=async()=>{const out={app:'gestion-belcorp',version:DB_VER,at:new Date().toISOString(),data:{}};for(const s in STORES)out.data[s]=await DB.all(s);

 $('#imp').onclick=()=>$('#impf').click();

  if(!confirm('Esto reemplaza los datos actuales con el respaldo. ¿Continuar?'))return;

/* ===== FASES 3-11: clientes, campañas, pedidos, recepciones, ventas, cobros, gastos, historial, reportes, pruebas ===== */
let SEQ=0;const nowI=()=>new Date().toISOString(),todayS=()=>nowI().slice(0,10),atq=()=>nowI()+String(++SEQ).padStart(5,'0'),pad=(n,w)=>String(n).padStart(w,'0'),r2=n=>Math.round(n*100)/100,sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const METHODS=['Efectivo','QR','Transferencia','Otro'],GCATS=['Transporte','Empaque','Publicidad','Comunicación','Comisiones','Operación','Otros'];
Object.assign(MT,{recepcion:'Recepción Belcorp',venta:'Venta',anulacion:'Anulación de venta'});
async function nextNum(k,pre,w){S.counters=S.counters||{};S.counters[k]=(S.counters[k]||0)+1;await saveSettings();return pre+pad(S.counters[k],w)}
const okP=p=>p.status!=='anulado';
async function saleBal(s){return r2(s.total-sum((await DB.all('payments')).filter(p=>p.saleId===s.id&&okP(p)),p=>p.amount))}
async function custBal(cid){const ss=(await DB.all('sales')).filter(s=>s.customerId===cid&&s.status==='activa'),ids=new Set(ss.map(s=>s.id));return r2(sum(ss,s=>s.total)-sum((await DB.all('payments')).filter(p=>ids.has(p.saleId)&&okP(p)),p=>p.amount))}
async function lotsOf(pid){const mv=await DB.all('invMovements');return(await DB.all('lots')).filter(l=>l.productId===pid).map(l=>({...l,av:sum(mv.filter(m=>m.lotId===l.id),m=>m.qty)})).sort((a,b)=>a.date.localeCompare(b.date)||(a.at||'').localeCompare(b.at||''))}
const sg=c=>r2(S.rules.marginFormula==='price'&&S.margin<100?c/(1-S.margin/100):c*(1+S.margin/100));
async function sugerido(pid){const ls=(await lotsOf(pid)).filter(l=>l.cost>0);return ls.length?sg(ls[ls.length-1].cost):0}
const chkPay=(m,q)=>{if(m==='QR'&&!q)throw Error('Elige qué QR se usó')};
/* --- reservas (pedido ≠ reserva) --- */
async function refreshOrder(oid){const o=await DB.get('customerOrders',oid);if(!o||o.status==='Cancelado')return;const its=(await DB.all('orderItems')).filter(i=>i.orderId===oid);o.status=its.every(i=>i.delivered>=i.qty)?'Entregado':its.every(i=>i.reserved+i.delivered>=i.qty)?'Listo':its.some(i=>i.reserved+i.delivered>0)?'Parcial':'Pendiente';await DB.put('customerOrders',o)}
async function reservar(oid){const o=await DB.get('customerOrders',oid);if(!o||['Cancelado','Entregado'].includes(o.status))return;for(const i of(await DB.all('orderItems')).filter(i=>i.orderId===oid)){const need=i.qty-i.reserved-i.delivered;if(need<=0)continue;const g=Math.min(need,calc((await stockMap())[i.productId]).disp);if(g>0){i.reserved+=g;await DB.put('orderItems',i)}}await refreshOrder(oid)}
/* --- servicios --- */
async function crearCampana(d){if(!d.name||!(d.tc>0))throw Error('Indica nombre y TC');const c={id:uid('c'),name:d.name,start:d.start||'',end:d.end||'',tc:d.tc,status:'abierta',createdAt:nowI()};await DB.put('campaigns',c);await log('campaña','Campaña '+c.name+' · TC '+c.tc,c.id);return c.id}
async function addCampItem(cid,d){const c=await DB.get('campaigns',cid);if(!c||c.status==='cerrada')throw Error('La campaña está cerrada');if(!(d.qty>0)||!(d.pn>=0))throw Error('Cantidad y precio inválidos');const it={id:uid('ci'),campaignId:cid,productId:d.productId,qty:d.qty,pn:d.pn,pp:d.pp||0,pa:d.pp>0?d.pp:d.pn,received:0};await DB.put('campaignItems',it);await log('campaña','Producto agregado a '+c.name,cid);return it.id}
async function recibir(d){const c=await DB.get('campaigns',d.campaignId);if(!c)throw Error('Elige una campaña');if(c.status==='cerrada')throw Error('Campaña cerrada');
 const items=(await DB.all('campaignItems')).filter(i=>i.campaignId===c.id),lines=d.lines.filter(l=>l.qty>0);if(!lines.length)throw Error('No hay cantidades recibidas');
 for(const l of lines){const it=items.find(i=>i.id===l.itemId);if(it.received+l.qty>it.qty&&!l.confirmExtra)throw Error('EXTRA:'+it.id)}
 const rid=uid('r'),num=await nextNum('reception','R-',5),date=d.date||todayS();
 for(const l of lines){const it=items.find(i=>i.id===l.itemId),lot={id:uid('l'),productId:it.productId,origin:'recepcion',label:c.name,date,at:atq(),campaignId:c.id,receptionId:rid,tc:c.tc,priceUSD:it.pa,pn:it.pn,pp:it.pp,cost:r2(it.pa*c.tc),salePrice:null,qtyReceived:l.qty,note:''};
  await DB.put('lots',lot);await DB.put('invMovements',{id:uid('m'),productId:it.productId,lotId:lot.id,at:nowI(),date,type:'recepcion',qty:l.qty,reason:'',note:c.name,ref:rid});
  await DB.put('receptionItems',{id:uid('ri'),receptionId:rid,itemId:it.id,productId:it.productId,ordered:it.qty,before:it.received,received:l.qty});it.received+=l.qty;await DB.put('campaignItems',it)}
 await DB.put('receptions',{id:rid,num,campaignId:c.id,date,invoiceNo:d.invoiceNo||'',invoiceAmount:d.invoiceAmount||0,invoiceFile:d.invoiceFile||'',status:items.every(i=>i.received>=i.qty)?'Completada':'Con diferencias'});
 for(const o of(await DB.all('customerOrders')).filter(o=>!['Cancelado','Entregado'].includes(o.status)).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)))await reservar(o.id);
 await log('recepción',num+' · '+c.name,c.id);return rid}
async function crearPedido(d){if(!d.customerId||!d.items.length)throw Error('Elige cliente y productos');const id=uid('o'),num=await nextNum('order','P-',5);
 await DB.put('customerOrders',{id,num,customerId:d.customerId,campaignId:d.campaignId||'',eta:d.eta||'',note:d.note||'',status:'Pendiente',createdAt:nowI()});
 for(const i of d.items)await DB.put('orderItems',{id:uid('oi'),orderId:id,productId:i.productId,qty:i.qty,price:i.price||0,reserved:0,delivered:0});await log('pedido','Pedido '+num,id);return id}
async function anticipo(d){if(!(d.amount>0))throw Error('Indica el monto');chkPay(d.method,d.qrId);const o=await DB.get('customerOrders',d.orderId);await DB.put('advances',{id:uid('a'),orderId:d.orderId,customerId:o.customerId,amount:d.amount,method:d.method,qrId:d.qrId||'',date:todayS(),used:false});await log('pedido','Anticipo '+bs(d.amount)+' · '+o.num,o.id)}
async function addPay(p){const s=await DB.get('sales',p.saleId),b=await saleBal(s),rec={id:uid('p'),...p,at:atq(),date:todayS(),before:b,after:r2(b-p.amount),status:'activo'};await DB.put('payments',rec);return rec}
async function vender(d){const its=d.items.filter(i=>i.qty>0),pay=d.pay||{type:'credit'};if(!d.customerId||!its.length)throw Error('Elige cliente y productos');
 const total=r2(sum(its,i=>i.qty*i.price));if(pay.type!=='credit')chkPay(pay.method,pay.qrId);if(pay.type==='partial'&&(!(pay.amount>0)||pay.amount>total))throw Error('El pago parcial debe ser mayor a 0 y no superar el total');
 const oi=d.orderId?(await DB.all('orderItems')).filter(i=>i.orderId===d.orderId):[],sm=await stockMap();
 for(const i of its){const av=calc(sm[i.productId]).disp+sum(oi.filter(x=>x.productId===i.productId),x=>x.reserved);if(i.qty>av)throw Error('Stock insuficiente: '+(await DB.get('products',i.productId)).name+' (disponible '+av+')')}
 const id=uid('s'),num=await nextNum('sale','#',6),date=todayS();await DB.put('sales',{id,num,customerId:d.customerId,date,at:atq(),total,status:'activa',orderId:d.orderId||'',note:d.note||''});
 for(const i of its){let need=i.qty,ls=await lotsOf(i.productId);if(S.rules.lotConsumption==='lifo')ls.reverse();for(const l of ls){if(need<=0)break;const t=Math.min(need,l.av);if(t<=0)continue;need-=t;
  await DB.put('saleItems',{id:uid('si'),saleId:id,productId:i.productId,lotId:l.id,qty:t,price:i.price,cost:l.cost});await DB.put('invMovements',{id:uid('m'),productId:i.productId,lotId:l.id,at:nowI(),date,type:'venta',qty:-t,reason:'',note:num,ref:id})}}
 if(d.orderId){for(const i of its)for(const x of oi.filter(x=>x.productId===i.productId)){x.reserved-=Math.min(i.qty,x.reserved);x.delivered=Math.min(x.qty,x.delivered+i.qty);await DB.put('orderItems',x)}await refreshOrder(d.orderId);
  for(const a of(await DB.all('advances')).filter(a=>a.orderId===d.orderId&&!a.used)){const b=await saleBal({id,total});if(b<=0)break;const amt=Math.min(a.amount,b);await addPay({saleId:id,customerId:d.customerId,amount:amt,method:'Anticipo',qrId:a.qrId,type:'anticipo',note:'Anticipo del pedido'});a.used=true;a.usedAmount=amt;await DB.put('advances',a)}}
 const b=await saleBal({id,total});if(pay.type==='full'&&b>0)await addPay({saleId:id,customerId:d.customerId,amount:b,method:pay.method,qrId:pay.qrId||'',type:'venta',note:''});
 if(pay.type==='partial')await addPay({saleId:id,customerId:d.customerId,amount:pay.amount,method:pay.method,qrId:pay.qrId||'',type:'venta',note:''});
 await log('venta','Venta '+num+' · '+bs(total),id);return id}
async function cobrar(d){const saldo=await custBal(d.customerId);if(!(d.amount>0))throw Error('Indica el monto');if(d.amount>saldo+.001)throw Error('El monto supera la deuda ('+bs(saldo)+'). Pago mayor a la deuda: regla pendiente de definir');chkPay(d.method,d.qrId);
